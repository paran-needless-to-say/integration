version: "3.8"

services:
  risk-scoring:
    build:
      context: ./risk-scoring
      dockerfile: Dockerfile
    container_name: trace-x-risk-scoring
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trace-x-backend
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    depends_on:
      risk-scoring:
        condition: service_healthy
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/dashboard/summary"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: trace-x-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trace-x-network:
    driver: bridge
