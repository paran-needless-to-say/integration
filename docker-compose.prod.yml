services:
  risk-scoring:
    build:
      context: ./risk-scoring
      dockerfile: Dockerfile
    container_name: trace-x-risk-scoring
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s # 서버 시작 시간 여유를 위해 120초로 증가
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trace-x-backend
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - ALLOW_ALL_ORIGINS=true # 개발 환경: CORS 모든 origin 허용
      - RISK_SCORING_API_URL=${RISK_SCORING_API_URL:-http://3.38.112.25:5001}
    depends_on:
      - risk-scoring
      # condition: service_healthy  # 임시 비활성화 - healthcheck 문제 해결 후 다시 활성화
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"] # 간단한 health 엔드포인트 사용
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # 서버 시작 시간 여유를 위해 60초로 증가
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-http://3.38.112.25:8888}
    container_name: trace-x-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trace-x-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trace-x-network:
    driver: bridge
